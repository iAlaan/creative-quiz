<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Creative Psyche Assessment (Organizational Tool)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ec4899;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: var(--primary);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .step-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent);
            text-align: center;
        }

        /* Image Choice Grid */
        .choices-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .choice-card {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .choice-card:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.1);
        }

        .choice-card.selected {
            border-color: var(--accent);
            background: rgba(236, 72, 153, 0.15);
            box-shadow: 0 0 12px rgba(236, 72, 153, 0.3);
        }

        .choice-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .choice-text {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .nav-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: var(--primary-hover);
        }

        .nav-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        /* Result Section */
        .result-section {
            display: none;
            text-align: center;
        }

        .canvas-container {
            width: 250px;
            height: 250px;
            margin: 0 auto 20px auto;
            border-radius: 15px;
            background: #0f172a;
            border: 2px solid var(--primary);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .result-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .result-box h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 0.95rem;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าทำแบบประเมินแบบเลือกภาพ -->
    <div id="quiz-container">
        <h1>Visual Creative Profile</h1>
        <p class="subtitle">เลือกสัญลักษณ์ที่ตรงกับสไตล์การทำงานและกระบวนการคิดของคุณในแต่ละสถานการณ์</p>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div id="step-container">
            <div class="step-title" id="step-title">คำถาม...</div>
            <div class="choices-grid" id="choices-grid">
                <!-- ตัวเลือกภาพจะถูกโหลดด้วย JS -->
            </div>
        </div>

        <button class="nav-btn" id="next-btn" onclick="nextStep()" disabled>เลือกสัญลักษณ์นี้แล้วไปต่อ</button>
    </div>

    <!-- หน้าแสดงผลลัพธ์พร้อม Canvas รวมเลเยอร์ภาพ -->
    <div id="result-container" class="result-section">
        <h1>รายงานผลและภาพสะท้อนตัวตน</h1>
        <p class="subtitle" id="res-archetype-name">ชื่อโปรไฟล์</p>
        
        <div class="canvas-container">
            <canvas id="resultCanvas" width="400" height="400"></canvas>
        </div>

        <div class="result-box">
            <h3>🎨 สไตล์ความคิดสร้างสรรค์ของคุณ</h3>
            <p id="res-desc">วิเคราะห์...</p>
        </div>

        <div class="result-box">
            <h3>🛠️ ข้อแนะนำการพัฒนาและการทำงานในองค์กร</h3>
            <p id="res-action">คำแนะนำ...</p>
        </div>

        <button class="nav-btn" onclick="location.reload()">🔄 ทำแบบประเมินใหม่อีกครั้ง</button>
    </div>
</div>

<script>
    // ฐานข้อมูลสถานการณ์และตัวเลือกภาพ (Visual Cards)
    const steps = [
        {
            stage: "Stage 1: Preparation (ขั้นเตรียมข้อมูล)",
            question: "เมื่อเริ่มโปรเจกต์ใหม่ สไตล์การเก็บข้อมูลของคุณคล้ายกับอะไร?",
            options: [
                { id: "p1", icon: "🌐", text: "มองภาพกว้างเชื่อมโยงรอบด้าน", trait: "flexibility", shape: "circle" },
                { id: "p2", icon: "📐", text: "วางโครงสร้างและระบบระเบียบ", trait: "elaboration", shape: "square" }
            ]
        },
        {
            stage: "Stage 2: Illumination (ขั้นปิ๊งไอเดีย)",
            question: "เวลาที่คุณได้ไอเดียเจ๋งๆ ลักษณะมันมักจะเป็นแบบไหน?",
            options: [
                { id: "i1", icon: "⚡", text: "พรั่งพรู รวดเร็ว ไหลมาเทมา", trait: "fluency", shape: "burst" },
                { id: "i2", icon: "🔮", text: "แปลกใหม่ หลุดกรอบคาดไม่ถึง", trait: "originality", shape: "star" }
            ]
        },
        {
            stage: "Stage 3: Verification (ขั้นตรวจสอบ & บริหารจัดการ)",
            question: "สิ่งที่คุณมักจะต้องระมัดระวังหรือท้าทายที่สุดในช่วงปิดโปรเจกต์คืออะไร?",
            options: [
                { id: "v1", icon: "🔍", text: "การตรวจเช็กดีเทลยิบย่อยไม่ให้ตกหล่น", trait: "elaboration", shape: "ring" },
                { id: "v2", icon: "🔄", text: "การปรับตัวเมื่อเจอแผนเปลี่ยนกะทันหัน", trait: "executive", shape: "wave" }
            ]
        }
    ];

    let currentStep = 0;
    let selectedChoices = [];
    let userSelections = {};

    const stepTitle = document.getElementById('step-title');
    const choicesGrid = document.getElementById('choices-grid');
    const nextBtn = document.getElementById('next-btn');
    const progressFill = document.getElementById('progress-fill');
    const quizContainer = document.getElementById('quiz-container');
    const resultContainer = document.getElementById('result-container');

    function loadStep() {
        let st = steps[currentStep];
        stepTitle.innerText = `${st.stage} : ${st.question}`;
        
        let html = "";
        st.options.forEach((opt, idx) => {
            let isSelected = userSelections[currentStep] === idx ? "selected" : "";
            html += `
                <div class="choice-card ${isSelected}" onclick="selectChoice(${idx})">
                    <div class="choice-icon">${opt.icon}</div>
                    <div class="choice-text">${opt.text}</div>
                </div>
            `;
        });
        choicesGrid.innerHTML = html;

        let progress = ((currentStep) / steps.length) * 100;
        progressFill.style.width = progress + '%';
        nextBtn.disabled = userSelections[currentStep] === undefined;
    }

    function selectChoice(idx) {
        userSelections[currentStep] = idx;
        // เรนเดอร์ใหม่เพื่ออัปเดตกรอบที่เลือก
        loadStep();
    }

    function nextStep() {
        currentStep++;
        if (currentStep < steps.length) {
            loadStep();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizContainer.style.display = 'none';
        resultContainer.style.display = 'block';
        progressFill.style.width = '100%';

        // ดึงข้อมูลตัวเลือกที่ผู้ใช้เลือกมาเก็บไว้
        let choices = steps.map((st, idx) => st.options[userSelections[idx]]);
        
        // กำหนดชื่อโปรไฟล์จำลองตามรูปทรงที่เลือก
        document.getElementById('res-archetype-name').innerText = "✨ The Creative Synthesizer (สถาปัตยกรรมทางความคิดเฉพาะคุณ)";
        document.getElementById('res-desc').innerText = `จากการเลือกสัญลักษณ์ภาพของคุณ คุณเป็นคนที่ผสานความยืดหยุ่นเข้ากับความคิดสร้างสรรค์เชิงโครงสร้างได้อย่างลงตัว มีความสามารถในการมองภาพกว้างและผลิตไอเดียที่ทรงพลัง`;
        document.getElementById('res-action').innerText = `คำแนะนำสำหรับองค์กร: เหมาะกับการทำงานในทีมพัฒนานวัตกรรมที่มีความยืดหยุ่นสูง แต่อาจต้องมีพาร์ทเนอร์ช่วยตรวจสอบความถูกต้องในขั้นตอนสุดท้ายเพื่อความสมบูรณ์แบบ`;

        // วาดภาพประกอบเลเยอร์บน Canvas ตามภาพที่ผู้ใช้เลือก
        drawCompositeArt(choices);
    }

    // ฟังก์ชันวาดเลเยอร์ภาพผสมผสานตามที่ผู้ใช้เลือก
    function drawCompositeArt(choices) {
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, 400, 400);

        // 1. วาดพื้นหลัง Gradient
        let grad = ctx.createLinearGradient(0, 0, 400, 400);
        grad.addColorStop(0, '#1e293b');
        grad.addColorStop(1, '#4c1d95');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 400, 400);

        // 2. วาดเลเยอร์ตามรูปทรงที่ผู้ใช้เลือกในแต่ละข้อ
        choices.forEach((choice, index) => {
            ctx.save();
            ctx.translate(200, 200);

            if (choice.shape === 'circle' || choice.shape === 'ring') {
                ctx.beginPath();
                ctx.arc(0, 0, 80 + (index * 20), 0, Math.PI * 2);
                ctx.strokeStyle = index === 0 ? '#06b6d4' : '#ec4899';
                ctx.lineWidth = 4;
                ctx.stroke();
            } else if (choice.shape === 'square') {
                ctx.beginPath();
                ctx.rect(-70 - (index * 10), -70 - (index * 10), 140 + (index * 20), 140 + (index * 20));
                ctx.strokeStyle = '#8b5cf6';
                ctx.lineWidth = 3;
                ctx.stroke();
            } else {
                // รูปแบบดาวหรือระเบิดไอเดีย
                ctx.beginPath();
                ctx.arc(0, 0, 60 + (index * 25), 0, Math.PI * 2);
                ctx.fillStyle = index === 1 ? 'rgba(236, 72, 153, 0.3)' : 'rgba(99, 102, 241, 0.3)';
                ctx.fill();
            }
            ctx.restore();
        });

        // ข้อความลายเซ็นบนภาพ
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.fillText("Visual Psyche Blueprint © 2026", 20, 380);
    }

    loadStep();
</script>

</body>
</html>
